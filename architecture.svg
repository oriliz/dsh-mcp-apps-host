<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
    </marker>
  </defs>

  <!-- MCP Apps Server -->
  <rect x="20" y="150" width="200" height="260" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="120" y="182" text-anchor="middle" font-size="15" font-weight="600" fill="#24292f">MCP Apps Server</text>
  <text x="120" y="202" text-anchor="middle" font-size="11" fill="#57606a">declares io.modelcontextprotocol/ui</text>
  <text x="40" y="235" font-size="12" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tools/list  _meta.ui</text>
  <text x="40" y="257" font-size="12" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tools/call</text>
  <text x="40" y="279" font-size="12" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">resources/read</text>
  <text x="40" y="301" font-size="12" fill="#24292f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ui:// resources</text>
  <text x="120" y="392" text-anchor="middle" font-size="11" fill="#57606a">any server that embeds</text>
  <text x="120" y="408" text-anchor="middle" font-size="11" fill="#57606a">cards in tool results</text>

  <!-- DSH Host outer frame -->
  <rect x="280" y="30" width="400" height="500" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="480" y="58" text-anchor="middle" font-size="14" font-weight="600" fill="#24292f">DSH Host</text>

  <!-- Server plugin -->
  <rect x="310" y="80" width="340" height="110" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="480" y="107" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">Server plugin (Node)</text>
  <text x="480" y="127" text-anchor="middle" font-size="11" fill="#57606a">MCP client — capabilities declare the ui extension</text>
  <text x="480" y="145" text-anchor="middle" font-size="11" fill="#57606a">tool registry — _meta.ui preserved end to end</text>
  <text x="480" y="163" text-anchor="middle" font-size="11" fill="#57606a">presentationMeta — projects meta.mcpApp</text>

  <!-- Agent loop -->
  <rect x="310" y="215" width="340" height="95" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="242" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">Agent loop + conversation</text>
  <text x="480" y="262" text-anchor="middle" font-size="11" fill="#57606a">model calls a registered tool</text>
  <text x="480" y="280" text-anchor="middle" font-size="11" fill="#57606a">result reaches the UI with meta.mcpApp attached</text>
  <text x="480" y="298" text-anchor="middle" font-size="11" fill="#57606a">card HTML stays out of the model context</text>

  <!-- HTTP bridge -->
  <rect x="310" y="390" width="340" height="110" rx="8" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="480" y="417" text-anchor="middle" font-size="13" font-weight="600" fill="#24292f">HTTP bridge</text>
  <text x="480" y="437" text-anchor="middle" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#57606a">/mcp-apps/&lt;serverName&gt;/bridge</text>
  <text x="480" y="455" text-anchor="middle" font-size="11" fill="#57606a">tools/call — registered-tools whitelist</text>
  <text x="480" y="473" text-anchor="middle" font-size="11" fill="#57606a">resources/read — ui:// URIs only</text>
  <text x="480" y="491" text-anchor="middle" font-size="11" fill="#57606a">session_id auto-injected</text>

  <!-- Card -->
  <rect x="720" y="150" width="180" height="260" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="810" y="182" text-anchor="middle" font-size="14" font-weight="600" fill="#24292f">Card</text>
  <text x="810" y="210" text-anchor="middle" font-size="11" fill="#57606a">McpAppCard (React)</text>
  <text x="810" y="228" text-anchor="middle" font-size="11" fill="#57606a">rendered in place of the</text>
  <text x="810" y="244" text-anchor="middle" font-size="11" fill="#57606a">plain tool-result row</text>
  <rect x="740" y="268" width="140" height="120" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
  <text x="810" y="290" text-anchor="middle" font-size="11" fill="#24292f">sandboxed iframe</text>
  <text x="810" y="308" text-anchor="middle" font-size="11" fill="#57606a">allow-scripts</text>
  <text x="810" y="324" text-anchor="middle" font-size="11" fill="#57606a">per-card CSP</text>
  <text x="810" y="348" text-anchor="middle" font-size="11" fill="#57606a">event.source guard</text>
  <text x="810" y="366" text-anchor="middle" font-size="11" fill="#57606a">on every message</text>

  <!-- Server <-> server plugin: transport -->
  <line x1="220" y1="195" x2="310" y2="195" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="215" x2="220" y2="215" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="265" y="185" text-anchor="middle" font-size="11" fill="#57606a">stdio /</text>
  <text x="265" y="236" text-anchor="middle" font-size="11" fill="#57606a">streamable-http</text>

  <!-- server plugin -> agent loop -->
  <line x1="480" y1="190" x2="480" y2="215" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490" y="206" font-size="11" fill="#57606a">registers tools</text>

  <!-- agent loop -> card -->
  <line x1="650" y1="262" x2="720" y2="262" stroke="#0969da" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="685" y="252" text-anchor="middle" font-size="11" fill="#0969da">tool result</text>
  <text x="685" y="278" text-anchor="middle" font-size="11" fill="#0969da">+ meta.mcpApp</text>

  <!-- card <-> iframe: postMessage (inside card box, implicit) -->

  <!-- iframe -> bridge: postMessage + fetch, down the right side and back -->
  <path d="M 860 410 L 860 500 L 650 500" fill="none" stroke="#0969da" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="755" y="492" text-anchor="middle" font-size="11" fill="#0969da">postMessage → fetch (JSON-RPC)</text>

  <!-- bridge -> server -->
  <path d="M 310 445 L 120 445 L 120 410" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="215" y="435" text-anchor="middle" font-size="11" fill="#57606a">proxied tools/call · resources/read</text>

  <!-- ui/message path: iframe back to conversation -->
  <path d="M 780 268 C 700 320 690 270 650 280" fill="none" stroke="#8250df" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="735" y="330" text-anchor="middle" font-size="11" fill="#8250df">ui/message →</text>
  <text x="735" y="345" text-anchor="middle" font-size="11" fill="#8250df">model turn</text>

  <!-- legend -->
  <text x="20" y="530" font-size="11" fill="#57606a">solid grey: MCP protocol calls&#160;&#160;&#160;blue: card data flow&#160;&#160;&#160;dashed purple: ui/message back-channel (debounced)</text>
</svg>
